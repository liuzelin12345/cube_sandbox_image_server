Name: cube_sandbox_image_server-api
Host: 0.0.0.0
Port: 43999
Timeout: 30000

TencentCloud:
  Region: ap-shanghai
  Endpoint: ags.tencentcloudapi.com
  RequestTimeout: 10s                 #发送请求超时
  StatusPollInterval: 5s              #查询沙箱状态的时间间隔
  StatusPollTimeout: 20s              #查询状态超时

ImageSync:
  Endpoint: http://172.20.208.115/sync/image
  RequestTimeout: 20s                 #请求超时
  AttemptTimeout: 1s                  #重试超时
  MaxResponseBytes: 1048576
  MaxAttempts: 3                      #重试次数
  RetryInterval: 500ms

Registry:
  AllowedHosts:
    - ths-shanghai-tcr.tencentcloudcr.com
  RequestTimeout: 10s
