Name: cube_sandbox_image_server-api
Host: 0.0.0.0
Port: 43999
Timeout: 600000                           # go-zero HTTP 请求总超时，单位为毫秒

TencentCloud:
  SecretID: ""                       # 必填：腾讯云 SecretId，请勿提交真实值
  SecretKey: ""                      # 必填：腾讯云 SecretKey，请勿提交真实值
  Region: ap-shanghai
  Endpoint: ags.tencentcloudapi.com
  RequestTimeout: 60s                    # CreateSandboxTool 单次调用超时
  StatusPollInterval: 5s                 # 创建成功后查询 Tool 状态的间隔
  StatusPollTimeout: 30s                 # 创建成功后整个状态轮询阶段的总超时

ImageSync:
  Endpoint: http://172.20.208.115/sync/image
  RequestTimeout: 600s                    # 整个镜像同步流程的总超时，包含所有尝试和重试等待
  AttemptTimeout: 300s                    # 单次 HTTP 请求超时，包含连接、等待响应和读取响应体
  MaxResponseBytes: 1048576              # 上游响应体最大字节数
  MaxAttempts: 3                         # 最多请求尝试次数，包含首次请求
  RetryInterval: 500ms                   # 首次重试等待时间，后续按指数退避增加

Registry:
  Username: ""                       # 必填：Registry 用户名，请勿提交真实值
  Password: ""                       # 必填：Registry 密码，请勿提交真实值
  AllowedHosts:
    - ths-shanghai-tcr.tencentcloudcr.com
    - aime-agent-tcr.tencentcloudcr.com
  RequestTimeout: 10s                    # Registry API 单次 HTTP 请求超时
